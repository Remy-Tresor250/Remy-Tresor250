<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" fill="none" role="img" aria-label="Niyitegeka Remy Tresor — Full-Stack Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f2a"/>
      <stop offset="45%" stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFD54A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 800 46px 'Segoe UI', Ubuntu, sans-serif; fill: url(#accent); }
      .sub   { font: 600 20px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1ff; letter-spacing:.5px; }
      @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-10px) } }
      @keyframes twinkle { 0%,100%{ opacity:.2 } 50%{ opacity:1 } }
      @keyframes dash { to { stroke-dashoffset: 0 } }
      .bee { animation: float 4s ease-in-out infinite; transform-origin: center; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: dash 2.6s ease-out forwards; }
    </style>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="90"  cy="48"  r="1.8" style="animation-delay:.0s"/>
    <circle class="star" cx="210" cy="30"  r="1.4" style="animation-delay:.6s"/>
    <circle class="star" cx="360" cy="56"  r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="640" cy="34"  r="1.5" style="animation-delay:.3s"/>
    <circle class="star" cx="780" cy="60"  r="1.8" style="animation-delay:.9s"/>
    <circle class="star" cx="900" cy="40"  r="1.4" style="animation-delay:1.5s"/>
    <circle class="star" cx="930" cy="150" r="1.6" style="animation-delay:.4s"/>
    <circle class="star" cx="60"  cy="170" r="1.5" style="animation-delay:1.1s"/>
  </g>

  <!-- glowing orbit -->
  <circle cx="500" cy="130" r="118" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.25"/>
  <path class="line" d="M120 205 H880" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- bee mascot -->
  <g class="bee" transform="translate(860 120)" filter="url(#soft)">
    <ellipse cx="0" cy="0" rx="26" ry="20" fill="#FFD54A"/>
    <path d="M-14 -14 q14 -10 28 0" fill="none" stroke="#1a1035" stroke-width="3"/>
    <rect x="-18" y="-12" width="8" height="24" rx="3" fill="#1a1035"/>
    <rect x="-2"  y="-14" width="8" height="28" rx="3" fill="#1a1035"/>
    <rect x="14"  y="-10" width="7" height="20" rx="3" fill="#1a1035"/>
    <ellipse cx="-6" cy="-18" rx="14" ry="9" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="10" cy="-16" rx="12" ry="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="-22" cy="-20" r="2.5" fill="#1a1035"/>
    <circle cx="-14" cy="-22" r="2.5" fill="#1a1035"/>
  </g>

  <!-- text -->
  <text class="title" x="60" y="120">Remy Tresor</text>
  <text class="sub"   x="62" y="158">
    Full-Stack Dev
    <tspan fill="#FF7A00"> · </tspan> ML &amp; Embedded
    <tspan fill="#FF7A00"> · </tspan> Open-Source Builder
  </text>

  <!-- blinking cursor -->
  <rect x="60" y="178" width="14" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
