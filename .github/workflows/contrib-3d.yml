name: 3D contribution skyline

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/contrib-3d.yml

permissions:
  contents: write

concurrency:
  group: contrib-3d
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/contrib_3d.py assets/contrib-3d.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3D contribution skyline"
          git push
